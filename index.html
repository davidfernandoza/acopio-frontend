<!doctype html>
<html lang="es" class="page-loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6f5b" />
    <meta name="description" content="Encuentra y gestiona puntos de acopio de ayuda" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Acopio" />
    <title>Acopio</title>
    <style>
      .page-loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3efe6;
      }
      .page-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .page-loader-logo {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.5rem;
      }
      .page-loader-spinner {
        width: 2.25rem;
        height: 2.25rem;
        border: 3px solid rgba(31, 111, 91, 0.2);
        border-top-color: #1f6f5b;
        border-radius: 50%;
        animation: page-loader-spin 0.8s linear infinite;
      }
      .page-loader-text {
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        color: #1f6f5b;
      }
      @keyframes page-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-page-loader" class="page-loader-overlay" role="status" aria-live="polite">
      <div class="page-loader-content">
        <img
          src="/icons/icon-192.png"
          alt=""
          width="56"
          height="56"
          class="page-loader-logo"
        />
        <div class="page-loader-spinner" aria-hidden="true"></div>
        <p class="page-loader-text">Cargando…</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
